# Weekly check for new commits in jamiepine/voicebox. Opens (or updates) a
# pull request from the branch `upstream-sync` into main. When the merge
# conflicts, the branch holds plain upstream main and the PR says so; resolve
# it locally with `git merge upstream/main`.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'jamiepine/voicebox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jamiepine/voicebox.git
          git fetch upstream main
          echo "NEW=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_ENV"

      - name: Merge into upstream-sync
        if: env.NEW != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-sync
          if git merge --no-ff --no-edit upstream/main; then
            echo "CONFLICT=no" >> "$GITHUB_ENV"
          else
            git merge --abort
            git reset --hard upstream/main
            echo "CONFLICT=yes" >> "$GITHUB_ENV"
          fi
          git push --force origin upstream-sync

      - name: Open pull request
        if: env.NEW != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CONFLICT" = "yes" ]; then
            note="The merge conflicts with this fork. The branch contains upstream main as is; merge locally with \`git fetch upstream && git merge upstream/main\` and resolve the conflicts."
          else
            note="Merged cleanly. Run the backend tests and a dev build before merging."
          fi
          body="$NEW new upstream commit(s) from jamiepine/voicebox.

          $note"
          if gh pr list --head upstream-sync --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit upstream-sync --body "$body"
          else
            gh pr create --base main --head upstream-sync --title "Sync with upstream Voicebox" --body "$body"
          fi
